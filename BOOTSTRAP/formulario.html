  <div class="container">
    <br><br>
    <form>
      <div class="row mb-3">
        <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Nombres: </b></label>
        <div class="col-sm-4">
          <input type="name" class="form-control" id="inputEmail3" placeholder="Escriba sus nombres aquí">
        </div>
      </div>
      <div class="row mb-3">
        <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Cédula: </b></label>
        <div class="col-sm-4">
          <input type="text" maxlength="10" inputmode="numeric" class="form-control" id="inputEmail3" placeholder="Ingrese su número de cédula">
        </div>
      </div>
      <div class="row mb-3">
        <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Fecha de Nacimiento: </b></label>
        <div class="col-sm-4">
          <input type="date" class="form-control" id="inputEmail3">
        </div>
      </div>
      <div class="row mb-3">
        <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Ciudad: </b></label>
        <div class="col-sm-4">
          <input type="name" class="form-control" id="inputEmail3" placeholder="Escriba su ciudad aquí">
        </div>
        <br><br>
        <div class="row mb-3">
          <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Correo electrónico: </b></label>&nbsp;
          <div class="col-sm-4">
            <input type="email" class="form-control" id="inputEmail3" placeholder="Ingrese su correo ">
          </div>
          <br><br>
          <div class="row mb-3">
            <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Teléfono:  </b></label>&nbsp;
            <div class="col-sm-4">
              <input type="text" maxlength="10" inputmode="numeric" class="form-control" id="inputEmail3" placeholder="ingrese su número teléfonico">
            </div>
            <br><br>
            <div class="row mb-3">
              <label for="inputEmail3" class="col-sm-2 col-form-label"><b>Dirección: </b></label>&nbsp;&nbsp;
              <div class="col-sm-4">
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                  placeholder="Ej. calle pricipal, cuadra Nro. 5"></textarea>
              </div>
              <br><br><br><br><br>
              <div class="form-group">
                <div class="col-sm-4">
                  <label for="estado"><b>Estado Civil: </b></label>
                  <select class="form-control" id="estado">
                    <option value="seleccionar">Seleccionar</option>
                    <option value="soltero">Soltero/a</option>
                    <option value="casado">Casado/a</option>
                    <option value="divorciado">Divorciado/a</option>
                    <option value="viudo">Viudo/a</option>
                  </select>
                </div>
              </div>
              <br><br><br><br>
              <div class="form-group">
                <div class="col-sm-4">
                  <label for="etnia"><b>Etnia: </b></label>
                  <select class="form-control" id="etnia">
                    <option value="seleccionar">Seleccionar</option>
                    <option value="indigena">Indígena</option>
                    <option value="mestizo">Mestizo</option>
                    <option value="blanco">Blanco</option>
                    <option value="negro">Negro</option>
                  </select>
                </div>
              </div>
              <br><br><br><br>
              <div class="col-sm-10">
                <div class="form-group">
                  <label><b>Género: </b></label><br>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="masculino" value="masculino">
                    <label class="form-check-label" for="masculino">Masculino</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="femenino" value="femenino">
                    <label class="form-check-label" for="femenino">Femenino</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="otro" value="otro">
                    <label class="form-check-label" for="otro">Otro</label>
                  </div>
                </div>
                <br><br>
                <div class="form-group">
                  <label><b>Malos hábitos</b></label><br>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="fuma" value="fuma">
                    <label class="form-check-label" for="fuma">Fuma</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="toma" value="toma">
                    <label class="form-check-label" for="toma">Toma Alcohol</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="consume" value="consume">
                    <label class="form-check-label" for="consume">Consume Drogas</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="ninguno" value="ninguno">
                    <label class="form-check-label" for="ninguno">Ninguno</label>
                  </div>
                  <br><br>
                </div>

                <button type="submit" class="btn btn-primary"><b>ENVIAR</b></button>
    </form>
